<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>btrbaka: schedule</title>
    <style>
        .subject {
            font-size: larger;
            font-weight: bold;
        }
        .timerange {
            font-weight: normal;
            font-size: smaller;
        }
        td {
            border: 2px solid;
        }
        th, td {
            vertical-align: top;
            padding: 0.5em;
        }
        table tr td:first-child {
            text-align: center;
            vertical-align: middle;
        }
        table {
            border-collapse: collapse;
        }
        .back {
            padding: 1em;
            background-color: pink;
            margin: 1em;
            display: block;
            color: black;
            text-decoration: none;
        }
        .alert {
            padding: 1em;
            margin: 1em;
            border-radius: 4px;
        }
        .alert.error {
            background-color: #ffcdd2;
            color: #c62828;
        }
        .canceled {
            background-color: #ff174416;
        }
        .other {
            background-color: #69f0ae16;
        }
        .holiday {
            background-color: #4dd0e116;
        }
        .active {
            box-shadow: inset 0 0 0 2px #e91e63;
        }
    </style>
</head>
<body onload="javascript:getschedule()">
    <div id="alert"></div>
    <div id="schedule"></div>
    <a href="/btrbaka-lite" class="back">Go back</a>
    <script>
        function showAlert(message, type) {
            if (type === undefined) {
                type = "error";
            }
            var alertDiv = document.getElementById("alert");
            alertDiv.innerHTML = "";
            var alertElement = document.createElement("div");
            alertElement.className = "alert " + type;
            alertElement.innerHTML = message;
            alertDiv.appendChild(alertElement);
        }

        function parseTime(timeText) {
            var parts = timeText.split(":");
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function findById(array, id) {
            if (!array) {
                return null;
            }
            for (var i = 0; i < array.length; i++) {
                if (array[i].Id === id) {
                    return array[i];
                }
            }
            return null;
        }

        function findAbbrev(array, id) {
            var item = findById(array, id);
            return item ? item.Abbrev : "N/A";
        }

        function getschedule() {
            var token = localStorage.getItem("token");
            var url = localStorage.getItem("url");

            if (!url || !token) {
                showAlert("Not logged in! Go to the Account page to log in first.", "error");
                return;
            }

            var now = new Date();
            var today = now.toISOString().split("T")[0];

            var xhr = new XMLHttpRequest();
            xhr.open("GET", url + "api/3/timetable/actual?date=" + today, true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr.setRequestHeader("Authorization", "Bearer " + token);

            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) {
                    return;
                }

                if (xhr.status < 200 || xhr.status >= 300) {
                    showAlert("Failed to fetch schedule. Please try again.", "error");
                    return;
                }

                try {
                    var responseJson = JSON.parse(xhr.responseText);
                    var responseArray = [];
                    for (var key in responseJson) {
                        if (Object.prototype.hasOwnProperty.call(responseJson, key)) {
                            responseArray.push(responseJson[key]);
                        }
                    }

                    var scheduleDiv = document.getElementById("schedule");
                    scheduleDiv.innerHTML = "";
                    var scheduleTable = document.createElement("table");
                    scheduleDiv.appendChild(scheduleTable);

                    var scheduleTimeHeader = document.createElement("tr");
                    scheduleTable.appendChild(scheduleTimeHeader);
                    scheduleTimeHeader.appendChild(document.createElement("th"));

                    var periods = responseArray[0] || [];
                    for (var k = 0; k < periods.length; k++) {
                        var timeCell = document.createElement("th");
                        timeCell.innerHTML = (k + 1) + ".<br><span class='timerange'>" + periods[k].BeginTime + " - " + periods[k].EndTime + "</span>";
                        scheduleTimeHeader.appendChild(timeCell);
                    }

                    var weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
                    var dayRows = responseArray[1] || [];

                    for (var i = 0; i < dayRows.length; i++) {
                        var scheduleRow = document.createElement("tr");
                        scheduleTable.appendChild(scheduleRow);

                        var scheduleDay = document.createElement("td");
                        scheduleDay.innerHTML = weekdays[dayRows[i].DayOfWeek - 1] || "";
                        scheduleRow.appendChild(scheduleDay);

                        if (dayRows[i].DayType === "Holiday" || dayRows[i].DayType === "Celebration") {
                            for (var ii = 0; ii < periods.length; ii++) {
                                var cell = document.createElement("td");
                                cell.className = "holiday";
                                cell.innerHTML = dayRows[i].DayType;
                                scheduleRow.appendChild(cell);
                            }
                        } else {
                            var atoms = dayRows[i].Atoms || [];
                            for (var j = 0; j < atoms.length; j++) {
                                var atom = atoms[j];
                                var currentHourId = atom.HourId;
                                var expectedHourId = (j > 0) ? atoms[j - 1].HourId + 1 : currentHourId;

                                if (j > 0 && currentHourId !== expectedHourId) {
                                    var gapCell = document.createElement("td");
                                    gapCell.innerHTML = "";
                                    scheduleRow.appendChild(gapCell);
                                }

                                var scheduleRowItem = document.createElement("td");
                                var changeClass = "";

                                var room = "N/A";
                                if (!atom.Change) {
                                    room = findAbbrev(responseArray[6], atom.RoomId);
                                } else {
                                    if (atom.RoomId) {
                                        room = findAbbrev(responseArray[6], atom.RoomId);
                                        if (room !== "N/A") {
                                            room += "; ";
                                        }
                                        room += atom.Change.Description;
                                    } else {
                                        room = atom.Change.Description;
                                    }
                                    changeClass = atom.Change.ChangeType !== "Canceled" ? "other" : "canceled";
                                }

                                var subject = "N/A";
                                if (atom.SubjectId !== null) {
                                    var subjectObj = findById(responseArray[4], atom.SubjectId);
                                    if (subjectObj) {
                                        subject = subjectObj.Abbrev;
                                    }
                                }

                                var teacher = "N/A";
                                if (atom.TeacherId !== null) {
                                    var teacherObj = findById(responseArray[5], atom.TeacherId);
                                    if (teacherObj) {
                                        teacher = teacherObj.Abbrev;
                                    }
                                }

                                var currentTime = now.toISOString().split("T")[0];
                                var dateSchedule = (dayRows[i].Date || "").split("T")[0];

                                if (currentTime === dateSchedule) {
                                    var hours = now.getHours();
                                    var minutes = now.getMinutes();
                                    if (minutes < 10) {
                                        minutes = "0" + minutes;
                                    }
                                    var currentTimeStr = hours + ":" + minutes;
                                    var hourInfo = findById(responseArray[0], atom.HourId);

                                    if (hourInfo) {
                                        var startTime = hourInfo.BeginTime;
                                        var endTime = hourInfo.EndTime;
                                        var currentTimeInMinutes = parseTime(currentTimeStr);
                                        var startTimeInMinutes = parseTime(startTime);
                                        var endTimeInMinutes = parseTime(endTime);

                                        if (currentTimeInMinutes >= startTimeInMinutes && currentTimeInMinutes <= endTimeInMinutes) {
                                            if (changeClass) {
                                                changeClass += " active";
                                            } else {
                                                changeClass = "active";
                                            }
                                        }
                                    }
                                }

                                scheduleRowItem.className = changeClass;
                                scheduleRowItem.innerHTML = "<span class='subject'>" + subject + "</span><br>" + teacher + "<br>" + room;
                                scheduleRow.appendChild(scheduleRowItem);
                            }
                        }
                    }
                } catch (error) {
                    showAlert("An error occurred while fetching the schedule.", "error");
                }
            };

            xhr.send();
        }
    </script>
</body>
</html>
